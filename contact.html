
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Threaded - Contact Us</title>

    <!-- BOOTSTRAP CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- GOOGLE FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;700&family=Lexend:wght@300;400;700&family=Tilt+Neon:XROT,YROT@-45..45,-45..45&display=swap"
        rel="stylesheet">

    <!-- BOOTSTRAP ICONS -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <style>

        /* =========================================
           GENERAL WEBSITE STYLES
        ========================================= */

        :root {
            --primary-green: #2C3930;
            --secondary-green: #3F4F44;
            --brand-tan: #A27B5C;
            --bg-beige: #DCD7C9;

            --font-heading: 'Lexend', sans-serif;
            --font-body: 'Comfortaa', sans-serif;
            --font-logo: 'Tilt Neon', sans-serif;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            background-color: var(--bg-beige);
            font-family: var(--font-body);
            color: var(--primary-green);

            display: flex;
            flex-direction: column;

            min-height: 100vh;
        }

        .contact-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        main {
            flex-grow: 1;
        }

        h1,
        h2,
        h3,
        h4,
        h5,
        h6 {
            font-family: var(--font-heading);
            color: var(--primary-green);
        }

        a {
            color: var(--primary-green);
        }


        /* =========================================
           HEADER AND FOOTER
        ========================================= */

           /* header and footer */
		.product-page .site-header {
		    background-image: url('img/headerfooter-bg.jpg');
		    background-size: cover;
		    background-position: center;
		    background-repeat: no-repeat;
		    color: #DCD7C9;
		    width: 100%;
		    height: 100px;
		    display: flex;
		    align-items: center;
		}
		
		.product-page .site-footer {
		    background-image: url('img/headerfooter-bg.jpg');
		    margin-top: auto;
		    height: auto; 
		    min-height: 70px;
		    display: flex;
		    flex-direction: column;
		    justify-content: center;
		    padding: 1.5rem 0;
		    font-size: 15px;
		}
		
		.product-page .site-footer p {
		    color: #DCD7C9;
		}
		
		.product-page .nav-icon {
		    width: 50px;
		    height: 50px; 
		    margin-bottom: 5px;
		    object-fit: contain;
		}
		
		.product-page .footer-icon {
		    width: 25px;
		    height: 25px;
		    object-fit: contain;
		}
		
		.product-page .site-header a {
		    color: #DCD7C9 !important;
		    text-decoration: none;
		    font-size: 20px;
		}
		
		.product-page .site-footer a {
		    color: #DCD7C9 !important;
		    text-decoration: none;
		}
		
		.product-page .site-header a:hover, 
		.product-page .site-footer a:hover {
		    color: var(--product-brown) !important;
		}

        /* =========================================
           EMPTY BEIGE SPACE
        ========================================= */

        .contact-title {
            width: 100%;
            height: 25px;

            background-color: var(--bg-beige);
        }


        /* =========================================
           GREEN CONTACT HEADING
        ========================================= */

        .contact-subtitle {
            width: 100%;

            background-color: var(--primary-green);

            text-align: center;

            padding: 20px 15px;
        }

        .contact-subtitle h1 {
            font-family: var(--font-heading);

            font-size: 32px;
            font-weight: 700;

            color: var(--bg-beige);

            margin-bottom: 7px;
        }

        .contact-subtitle p {
            font-family: var(--font-body);

            font-size: 17px;

            color: var(--bg-beige);

            margin: 0;
        }


        /* =========================================
           MAIN CONTACT SECTION
        ========================================= */

        .contact-section {
            width: 100%;

            flex-grow: 1;

            padding: 35px 5%;

            background-color: var(--bg-beige);
        }


        /* =========================================
           CONTACT FORM
        ========================================= */

        .contact-form {
            background-color: var(--primary-green);

            padding: 30px;

            height: 520px;
            min-height: 520px;
            width: 100%;
        }

        .contact-form label {
            display: block;

            color: #E8E8DF;

            font-family: var(--font-body);
            font-size: 13px;

            margin-bottom: 9px;
        }


        /* =========================================
           FORM INPUT FIELDS
        ========================================= */

        .contact-form .form-control {
            background-color: #526357;

            color: white;

            border: none;
            border-radius: 0;

            font-family: var(--font-heading);
            font-size: 14px;

            margin-bottom: 18px;

            padding: 13px;
        }

        .contact-form .form-control::placeholder {
            color: var(--bg-beige);
            opacity: 1;
        }

        .contact-form .form-control:focus {
            background-color: #526357;

            color: white;

            box-shadow: 0 0 0 2px var(--brand-tan);
        }

        .contact-form textarea {
            resize: vertical;
            min-height: 130px;
        }


        /* =========================================
           SUBMIT BUTTON
        ========================================= */

        .submit-btn {
            background-color: var(--brand-tan);

            color: white;

            border: none;
            border-radius: 0;

            width: 60%;

            padding: 12px;

            font-family: var(--font-heading);
            font-size: 12px;
            font-weight: 700;

            letter-spacing: 1px;

            transition: 0.3s;
        }

        .submit-btn:hover {
            background-color: #89694F;
            color: white;
        }


        /* =========================================
           PORTRAIT IMAGE PLACEHOLDER
           SAME HEIGHT AS CONTACT FORM
        ========================================= */

        .contact-image {
            display: block;

            position: relative;

            width: 416px;
            max-width: 100%;

            height: 520px;

            margin: 0 auto;

            background-color: #C9C9C9;

            border: 1px solid #99958D;

            overflow: hidden;
        }

        .contact-image::before,
        .contact-image::after {
            content: "";

            position: absolute;

            width: 141.5%;
            height: 1px;

            background-color: #99958D;

            top: 50%;
            left: -20.75%;
        }

        .contact-image::before {
            transform: rotate(45deg);
        }

        .contact-image::after {
            transform: rotate(-45deg);
        }


        /* =========================================
           SOCIAL MEDIA LINKS
        ========================================= */

        .social-links {
            display: flex;

            justify-content: space-around;
            align-items: center;

            text-align: center;

            margin-top: 18px;
        }

        .social-links a {
            color: var(--primary-green);

            text-decoration: none;

            font-family: var(--font-heading);
            font-size: 13px;

            transition: 0.3s;
        }

        .social-links i {
            display: block;

            color: var(--primary-green);

            font-size: 25px;

            margin-bottom: 5px;
        }

        .social-links a:hover,
        .social-links a:hover i {
            color: var(--brand-tan);
        }

        /* =========================================
           ACCESSIBILITY
        ========================================= */

        a:focus-visible,
        button:focus-visible,
        input:focus-visible,
        textarea:focus-visible {
            outline: 3px solid var(--brand-tan);
            outline-offset: 2px;
        }


        /* =========================================
           RESPONSIVE DESIGN - TABLET AND MOBILE
        ========================================= */

        @media (max-width: 768px) {

            /* HEADER */

            .site-header {
                height: 80px;
                padding: 0;
            }

            .site-header .container-fluid {
                flex-direction: row;
                flex-wrap: nowrap;
                padding: 0 10px;
            }

            .site-header .logo img {
                width: 45px !important;
                height: 45px !important;
            }

            .site-header .logo-text {
                font-size: 1.2rem;
            }

            .site-header nav ul {
                gap: 10px;
            }

            .nav-icon {
                width: 25px;
                height: 25px;
            }

            .site-header a {
                font-size: 0.7rem;
            }


            /* CONTACT HEADING */

            .contact-title {
                height: 18px;
            }

            .contact-subtitle {
                padding: 18px 15px;
            }

            .contact-subtitle h1 {
                font-size: 27px;
            }

            .contact-subtitle p {
                font-size: 15px;
            }


            /* CONTACT SECTION */

            .contact-section {
                padding: 25px 18px;
            }

            .contact-form {
                padding: 20px;
                height: auto;
                min-height: 480px;
            }

            .contact-image {
                width: min(100%, 416px);
                height: auto;
                aspect-ratio: 4 / 5;
            }

            .submit-btn {
                width: 100%;
            }

            .social-links {
                margin-bottom: 10px;
            }


            /* FOOTER */

            .site-footer {
                padding: 1.5rem 0;
            }

        }


        /* =========================================
           SMALL MOBILE SCREENS
        ========================================= */

        @media (max-width: 480px) {

            .contact-subtitle h1 {
                font-size: 24px;
            }

            .contact-subtitle p {
                font-size: 14px;
            }

            .contact-section {
                padding: 20px 15px;
            }

            .contact-form {
                padding: 18px;
                min-height: auto;
            }

            .contact-image {
                width: min(100%, 416px);
                aspect-ratio: 4 / 5;
                height: auto;
            }

            .social-links a {
                font-size: 11px;
            }

            .social-links i {
                font-size: 22px;
            }

        }

    </style>

</head>


<body>

<div class="contact-page">


    <!-- =========================================
         HEADER AND NAVIGATION
    ========================================= -->

    <header class="site-header py-3">

        <div class="container-fluid px-3 px-md-5 d-flex justify-content-between align-items-center">


            <!-- LOGO -->

            <div class="logo d-flex align-items-center">

                <img src="img/ThreadedLogo-SimpleLight.png"
                    alt="Threaded Logo Simple Light"
                    class="me-2"
                    style="width: 83px; height: 83px; object-fit: contain;">

                <span class="logo-text"
                    style="font-family: 'Tilt Neon', sans-serif; font-variation-settings: 'XROT' 13, 'YROT' 45;">

                    Threaded

                </span>

            </div>


            <!-- NAVIGATION -->

            <nav>

                <ul class="d-flex gap-4 list-unstyled mb-0 text-center">


                    <!-- HOME -->

                    <li>

                        <a href="index.html"
                            class="d-flex flex-column align-items-center text-decoration-none">

                            <img src="img/home-icon-light.png"
                                alt="Home"
                                class="nav-icon">

                            Home

                        </a>

                    </li>


                    <!-- SHOP -->

                    <li>

                        <a href="index.html#products-section"
                            class="d-flex flex-column align-items-center text-decoration-none">

                            <img src="img/shop-icon-light.png"
                                alt="Shop"
                                class="nav-icon">

                            Shop

                        </a>

                    </li>


                    <!-- CONTACT -->

                    <li>

                        <a href="contact.html"
                            class="d-flex flex-column align-items-center text-decoration-none">

                            <img src="img/Contact-icon-light.png"
                                alt="Contact"
                                class="nav-icon">

                            Contact

                        </a>

                    </li>

                </ul>

            </nav>

        </div>

    </header>



    <!-- =========================================
         EMPTY BEIGE SPACE ABOVE HEADING
    ========================================= -->

    <section class="contact-title">

    </section>



    <!-- =========================================
         GREEN CONTACT US HEADING
    ========================================= -->

    <section class="contact-subtitle">

        <h1>CONTACT US</h1>

        <p>Got a question?</p>

    </section>



    <!-- =========================================
         MAIN CONTACT SECTION
    ========================================= -->

    <main class="contact-section">

        <div class="container-fluid">

            <div class="row g-4 align-items-start">


                <!-- LEFT COLUMN: CONTACT FORM -->

                <div class="col-md-7">

                    <form class="contact-form" id="contactForm">

                        <div class="row">


                            <!-- FIRST NAME -->

                            <div class="col-md-6">

                                <label for="firstName">
                                    Name (Optional)
                                </label>

                                <input type="text"
                                    class="form-control"
                                    id="firstName"
                                    name="firstName"
                                    placeholder="First Name">

                            </div>


                            <!-- LAST NAME -->

                            <div class="col-md-6">

                                <label for="lastName">
                                    &nbsp;
                                </label>

                                <input type="text"
                                    class="form-control"
                                    id="lastName"
                                    name="lastName"
                                    placeholder="Last Name">

                            </div>


                            <!-- EMAIL ADDRESS -->

                            <div class="col-md-6">

                                <label for="email">
                                    Email Address
                                </label>

                                <input type="email"
                                    class="form-control"
                                    id="email"
                                    name="email"
                                    placeholder="Enter your email address"
                                    required>

                            </div>


                            <!-- MOBILE NUMBER -->

                            <div class="col-md-6">

                                <label for="mobile">
                                    Mobile Number
                                </label>

                                <input type="tel"
                                    class="form-control"
                                    id="mobile"
                                    name="mobile"
                                    placeholder="Enter your mobile number">

                            </div>


                            <!-- MESSAGE -->

                            <div class="col-12">

                                <label for="message">
                                    Message
                                </label>

                                <textarea class="form-control"
                                    id="message"
                                    name="message"
                                    rows="6"
                                    placeholder="Write your message here..."
                                    required></textarea>

                            </div>

                        </div>


                        <!-- SUBMIT BUTTON -->

                        <div class="text-center mt-2">

                            <button type="submit" class="btn submit-btn">

                                SUBMIT

                            </button>

                        </div>

                    </form>

                </div>



                <!-- RIGHT COLUMN: IMAGE AND SOCIAL MEDIA -->

                <div class="col-md-5">


                    <!-- PORTRAIT IMAGE PLACEHOLDER -->

                    <div class="contact-image"
                        role="img"
                        aria-label="Contact Us image placeholder">

                    </div>



                    <!-- SOCIAL MEDIA LINKS -->

                    <div class="social-links">


                        <!-- FACEBOOK -->

                        <a href="https://www.facebook.com/"
                            target="_blank"
                            rel="noopener noreferrer">

                            <i class="bi bi-facebook"></i>

                            Facebook

                        </a>


                        <!-- INSTAGRAM -->

                        <a href="https://www.instagram.com/"
                            target="_blank"
                            rel="noopener noreferrer">

                            <i class="bi bi-instagram"></i>

                            Instagram

                        </a>


                        <!-- TIKTOK -->

                        <a href="https://www.tiktok.com/"
                            target="_blank"
                            rel="noopener noreferrer">

                            <i class="bi bi-tiktok"></i>

                            TikTok

                        </a>

                    </div>

                </div>

            </div>

        </div>

    </main>



    <!-- =========================================
         FOOTER
    ========================================= -->

    <footer class="site-footer text-center">

        <div class="container-fluid px-5">


            <!-- COPYRIGHT -->

            <p class="mb-1">

                ©2026 THREADED All Rights Reserved

            </p>


            <div class="d-flex justify-content-center gap-4 flex-wrap">


                <!-- PRIVACY POLICY -->

                <a href="privacy.html"
                    class="d-inline-flex align-items-center">

                    <img src="img/privacypolicy-icon-light.png"
                        alt="Privacy Policy Icon"
                        class="footer-icon me-1">

                    Privacy Policy

                </a>


                <!-- TERMS AND CONDITIONS -->

                <a href="terms.html"
                    class="d-inline-flex align-items-center">

                    <img src="img/termsandcondition-icon-light.png"
                        alt="Terms and Condition Icon"
                        class="footer-icon me-1">

                    Terms and Condition

                </a>

            </div>

        </div>

    </footer>


</div>



<!-- =========================================
     JAVASCRIPT: CONTACT FORM
========================================= -->

<script>

    const contactForm = document.getElementById("contactForm");

    contactForm.addEventListener("submit", function(event) {

        event.preventDefault();


        // GET FORM VALUES

        const firstName = document.getElementById("firstName").value.trim();

        const lastName = document.getElementById("lastName").value.trim();

        const email = document.getElementById("email").value.trim();

        const mobile = document.getElementById("mobile").value.trim();

        const message = document.getElementById("message").value.trim();


        // CHANGE THIS TO YOUR ACTUAL CONTACT EMAIL

        const recipient = "hello@examplewebsite142.com";


        // EMAIL SUBJECT

        const subject = encodeURIComponent(
            "Contact Us - Threaded Website"
        );


        // EMAIL BODY

        const body = encodeURIComponent(

            "CONTACT US - THREADED\n\n" +

            "Name: " + firstName + " " + lastName + "\n" +

            "Email Address: " + email + "\n" +

            "Mobile Number: " + mobile + "\n\n" +

            "Message:\n" + message

        );


        // OPEN DEFAULT EMAIL APPLICATION

        const mailtoLink = "mailto:" + recipient +
            "?subject=" + subject +
            "&body=" + body;


        window.location.href = mailtoLink;

    });

</script>



<!-- BOOTSTRAP JAVASCRIPT -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


</body>

</html>
