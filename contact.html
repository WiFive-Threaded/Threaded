<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Threaded</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&family=Lexend:wght@400;500;600;700&family=Tilt+Neon&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-green: #2C3930;
            --secondary-green: #3F4F44;
            --brand-tan: #A27B5C;
            --bg-beige: #DCD7C9;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: var(--bg-beige);
            color: var(--primary-green);
            font-family: 'Comfortaa', sans-serif;
        }

        /* NAVIGATION */
        .navbar {
            background-image: url("img/headerfooter-bg.jpg");
            background-size: cover;
            background-position: center;
            padding: 12px 5%;
        }

        .navbar-brand img {
            width: 150px;
            height: auto;
        }

        .navbar-nav {
            align-items: center;
            gap: 25px;
        }

        .navbar-nav .nav-link {
            color: white !important;
            font-family: 'Lexend', sans-serif;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .navbar-nav .nav-link img {
            width: 23px;
            height: 23px;
            object-fit: contain;
        }

        /* TOP SPACER */
        .contact-title {
            height: 25px;
            background-color: var(--bg-beige);
        }

        /* CONTACT HEADING */
        .contact-subtitle {
            background-color: var(--primary-green);
            color: white;
            text-align: center;
            padding: 25px 15px;
        }

        .contact-subtitle h1 {
            font-family: 'Lexend', sans-serif;
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .contact-subtitle p {
            font-size: 17px;
            margin: 0;
        }

        /* MAIN CONTACT SECTION */
        .contact-section {
            background-color: var(--bg-beige);
            padding: 45px 5%;
        }

        .contact-row {
            align-items: stretch;
        }

        /* CONTACT FORM PANEL */
        .contact-form {
            background-color: var(--primary-green);
            color: white;
            padding: 30px;
            width: 100%;
            min-height: 520px;
            border-radius: 4px;
        }

        .contact-form .form-label {
            font-size: 16px;
            font-weight: 400;
            margin-bottom: 8px;
        }

        .contact-form .form-control {
            font-family: 'Comfortaa', sans-serif;
            font-size: 16px;
            padding: 11px 13px;
            border-radius: 3px;
            border: 1px solid #ccc;
        }

        .contact-form .form-control:focus {
            border-color: var(--brand-tan);
            box-shadow: 0 0 0 0.2rem rgba(162, 123, 92, 0.25);
        }

        .contact-form textarea {
            resize: vertical;
            min-height: 130px;
        }

        /* CONTACT IMAGE */
        .contact-image {
            width: 100%;
            max-width: 416px;
            height: 520px;
            object-fit: cover;
            object-position: center;
            border: 3px solid var(--primary-green);
            display: block;
            margin: 0 auto;
        }

        /* BOTTOM ACTIONS */
        .contact-actions {
            margin-top: 20px;
        }

        .submit-btn {
            background-color: var(--brand-tan);
            color: white;
            border: none;
            border-radius: 3px;
            width: 60%;
            padding: 14px 20px;
            font-family: 'Lexend', sans-serif;
            font-size: 16px;
            font-weight: 700;
            transition: 0.3s ease;
        }

        .submit-btn:hover {
            background-color: var(--secondary-green);
            color: white;
        }

        .submit-btn:focus-visible {
            outline: 3px solid var(--primary-green);
            outline-offset: 3px;
        }

        /* FORM FEEDBACK */
        .form-feedback {
            display: none;
            color: var(--primary-green);
            font-size: 16px;
            font-weight: 400;
            line-height: 1.5;
            margin-top: 12px;
        }

        .form-feedback.show {
            display: block;
        }

        /* SOCIAL MEDIA */
        .social-links {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 22px;
        }

        .social-links a {
            color: var(--primary-green);
            text-decoration: none;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 7px;
            transition: 0.3s ease;
        }

        .social-links a:hover {
            color: var(--brand-tan);
        }

        .social-links i {
            font-size: 22px;
        }

        /* FOOTER */
        footer {
            background-image: url("img/headerfooter-bg.jpg");
            background-size: cover;
            background-position: center;
            color: white;
            padding: 25px 5%;
            font-family: 'Comfortaa', sans-serif;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 30px;
        }

        .footer-links a {
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .footer-links a:hover {
            color: var(--bg-beige);
        }

        .footer-links img {
            width: 22px;
            height: 22px;
            object-fit: contain;
        }

        .footer-copyright {
            text-align: center;
            margin-top: 18px;
            font-size: 13px;
        }

        /* TABLET */
        @media (max-width: 991px) {
            .contact-subtitle h1 {
                font-size: 30px;
            }

            .contact-subtitle p {
                font-size: 15px;
            }

            .contact-image {
                height: 520px;
            }
        }

        /* MOBILE */
        @media (max-width: 767px) {
            .navbar {
                padding: 10px 4%;
            }

            .navbar-brand img {
                width: 125px;
            }

            .navbar-nav {
                align-items: flex-start;
                gap: 8px;
                padding-top: 12px;
            }

            .contact-title {
                height: 18px;
            }

            .contact-subtitle {
                padding: 22px 12px;
            }

            .contact-subtitle h1 {
                font-size: 27px;
            }

            .contact-subtitle p {
                font-size: 14px;
            }

            .contact-section {
                padding: 30px 5%;
            }

            .contact-form {
                min-height: auto;
                padding: 24px 20px;
            }

            .contact-form .form-label {
                font-size: 16px;
            }

            .contact-form .form-control {
                font-size: 16px;
            }

            .contact-image {
                width: min(100%, 416px);
                height: auto;
                aspect-ratio: 4 / 5;
                margin-top: 30px;
            }

            .contact-actions {
                margin-top: 15px;
            }

            .submit-btn {
                width: 100%;
            }

            .social-links {
                gap: 15px;
                margin-top: 15px;
            }

            .social-links a {
                font-size: 14px;
            }

            .footer-links {
                gap: 18px;
            }

            .footer-copyright {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

    <!-- NAVIGATION BAR -->
    <nav class="navbar navbar-expand-md navbar-dark">
        <div class="container-fluid">

            <a class="navbar-brand" href="index.html">
                <img src="img/ThreadedLogo-SimpleLight.png" alt="Threaded Logo">
            </a>

            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarContent"
                aria-controls="navbarContent"
                aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">
                            <img src="img/home-icon-light.png" alt="">
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="shop.html">
                            <img src="img/shop-icon-light.png" alt="">
                            Shop
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="contact.html" aria-current="page">
                            <img src="img/Contact-icon-light.png" alt="">
                            Contact
                        </a>
                    </li>

                </ul>
            </div>
        </div>
    </nav>

    <!-- TOP SPACER -->
    <div class="contact-title"></div>

    <!-- CONTACT HEADING -->
    <section class="contact-subtitle">
        <h1>CONTACT US</h1>
        <p>Got a question?</p>
    </section>

    <!-- CONTACT SECTION -->
    <main class="contact-section">

        <div class="container-fluid">
            <div class="row contact-row g-4">

                <!-- LEFT COLUMN: CONTACT FORM -->
                <div class="col-md-7">

                    <form class="contact-form" id="contactForm">

                        <div class="row g-3">

                            <div class="col-sm-6">
                                <label for="firstName" class="form-label">
                                    First Name
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="firstName"
                                    name="firstName"
                                    placeholder="Enter your first name"
                                    autocomplete="given-name"
                                    required>
                            </div>

                            <div class="col-sm-6">
                                <label for="lastName" class="form-label">
                                    Last Name
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="lastName"
                                    name="lastName"
                                    placeholder="Enter your last name"
                                    autocomplete="family-name"
                                    required>
                            </div>

                            <div class="col-12">
                                <label for="email" class="form-label">
                                    Email Address
                                </label>

                                <input
                                    type="email"
                                    class="form-control"
                                    id="email"
                                    name="email"
                                    placeholder="Enter your email address"
                                    autocomplete="email"
                                    required>
                            </div>

                            <div class="col-12">
                                <label for="mobile" class="form-label">
                                    Mobile Number (Optional)
                                </label>

                                <input
                                    type="tel"
                                    class="form-control"
                                    id="mobile"
                                    name="mobile"
                                    placeholder="Enter your mobile number"
                                    autocomplete="tel">
                            </div>

                            <div class="col-12">
                                <label for="message" class="form-label">
                                    Message
                                </label>

                                <textarea
                                    class="form-control"
                                    id="message"
                                    name="message"
                                    placeholder="Write your message here..."
                                    required></textarea>
                            </div>

                        </div>
                    </form>

                    <!-- SUBMIT BUTTON -->
                    <div class="contact-actions">

                        <button
                            type="submit"
                            form="contactForm"
                            class="submit-btn">
                            SUBMIT
                        </button>

                        <p
                            class="form-feedback"
                            id="formFeedback"
                            role="status"
                            aria-live="polite">
                        </p>

                    </div>

                </div>

                <!-- RIGHT COLUMN: IMAGE AND SOCIAL MEDIA -->
                <div class="col-md-5">

                    <img
                        src="img/TSHIRTS%20DESIGN.png"
                        alt="Threaded T-shirt designs"
                        class="contact-image">

                    <!-- SOCIAL MEDIA LINKS -->
                    <div class="contact-actions social-links">

                        <a href="https://www.facebook.com/"
                            target="_blank"
                            rel="noopener noreferrer"
                            aria-label="Visit Facebook">
                            <i class="bi bi-facebook"></i>
                            Facebook
                        </a>

                        <a href="https://www.instagram.com/"
                            target="_blank"
                            rel="noopener noreferrer"
                            aria-label="Visit Instagram">
                            <i class="bi bi-instagram"></i>
                            Instagram
                        </a>

                        <a href="https://www.tiktok.com/"
                            target="_blank"
                            rel="noopener noreferrer"
                            aria-label="Visit TikTok">
                            <i class="bi bi-tiktok"></i>
                            TikTok
                        </a>

                    </div>

                </div>

            </div>
        </div>

    </main>

    <!-- FOOTER -->
    <footer>

        <div class="footer-links">

            <a href="privacy.html">
                <img src="img/privacypolicy-icon-light.png" alt="">
                Privacy Policy
            </a>

            <a href="terms.html">
                <img src="img/termsandcondition-icon-light.png" alt="">
                Terms and Conditions
            </a>

        </div>

        <div class="footer-copyright">
            © 2026 Threaded. All Rights Reserved.
        </div>

    </footer>

    <!-- BOOTSTRAP JAVASCRIPT -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- CONTACT FORM MAILTO FUNCTION -->
    <script>
        const contactForm = document.getElementById("contactForm");
        const formFeedback = document.getElementById("formFeedback");

        contactForm.addEventListener("submit", function(event) {

            // Prevent the form from refreshing the page
            event.preventDefault();

            // Collect the visitor's information
            const firstName = document.getElementById("firstName").value.trim();
            const lastName = document.getElementById("lastName").value.trim();
            const email = document.getElementById("email").value.trim();
            const mobile = document.getElementById("mobile").value.trim();
            const message = document.getElementById("message").value.trim();

            // Email recipient
            const recipient = "hello@examplewebsite142.com";

            // Generate inquiry reference number
            const inquiryNumber = Date.now().toString().slice(-6);

            // Prepare email subject
            const subject = encodeURIComponent(
                `THREADED-Inquiry [${inquiryNumber}]`
            );

            // Prepare email body
            const body = encodeURIComponent(
                "THREADED - CUSTOMER INQUIRY\n\n" +
                "Inquiry Reference: #" + inquiryNumber + "\n\n" +
                "Name: " + firstName + " " + lastName + "\n" +
                "Email Address: " + email + "\n" +
                "Mobile Number: " + (mobile || "Not provided") + "\n\n" +
                "Message:\n" + message
            );

            // Display submission instructions
            formFeedback.textContent =
                "Your email application will open with your inquiry prepared " +
                "and addressed to " + recipient +
                ". Please click SEND in your email application to complete your submission.";

            formFeedback.classList.add("show");

            // Create the mailto link
            const mailtoLink =
                "mailto:" + recipient +
                "?subject=" + subject +
                "&body=" + body;

            // Open the visitor's default email application
            window.location.href = mailtoLink;

        });
    </script>

</body>
</html>
