<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Threaded - Contact Us</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;700&family=Lexend:wght@300;400;700&family=Tilt+Neon:XROT,YROT@-45..45,-45..45&display=swap"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Existing Threaded Stylesheet -->
    <link rel="stylesheet" href="css/wifivestyle.css">

    <style>
        /* ==============================
           GENERAL PAGE SETTINGS
        ============================== */

        html, body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            font-family: 'Lexend', sans-serif;
            background-color: #dedacd;
        }

        .contact-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #dedacd;
        }

        /* ==============================
           HEADER
        ============================== */

        .contact-page .site-header {
            background-image: url('img/your-background-image.jpg');
            background-color: #071b12;
            background-size: cover;
            background-position: center;
            padding: 8px 0 !important;
            flex-shrink: 0;
        }

        .contact-page .logo img {
            width: 83px;
            height: 83px;
            object-fit: contain;
        }

        .contact-page .logo-text {
            color: #f5f1e8;
            font-size: 25px;
            font-family: 'Tilt Neon', sans-serif;
            font-variation-settings: 'XROT' 13, 'YROT' 45;
        }

        .contact-page nav a {
            color: #f5f1e8 !important;
            font-family: 'Lexend', sans-serif;
            font-size: 17px;
        }

        .contact-page .nav-icon {
            width: 45px;
            height: 45px;
            object-fit: contain;
        }

        /* ==============================
           CONTACT HEADING
        ============================== */

        .contact-page .contact-heading {
            display: block !important;
            visibility: visible !important;
            background-color: #293b30;
            color: #f5f1e8;
            text-align: center;
            padding: 22px 15px;
            width: 100%;
            flex-shrink: 0;
        }

        .contact-page .contact-heading h1 {
            font-family: 'Lexend', sans-serif;
            font-size: 30px;
            font-weight: 700;
            margin: 0 0 5px;
        }

        .contact-page .contact-heading p {
            font-family: 'Comfortaa', sans-serif;
            font-size: 14px;
            color: #d4d4ca;
            margin: 0;
        }

        /* ==============================
           MAIN CONTACT SECTION
        ============================== */

        .contact-page .contact-section {
            display: block !important;
            visibility: visible !important;
            opacity: 1 !important;
            position: relative;
            width: 100%;
            flex: 1 0 auto;
            padding: 35px 5%;
            background-color: #dedacd;
        }

        .contact-page .contact-section .row {
            display: flex;
            visibility: visible !important;
        }

        .contact-page .contact-form {
            display: block !important;
            visibility: visible !important;
            background-color: #293b30;
            padding: 25px;
            width: 100%;
            height: 100%;
        }

        /* ==============================
           FORM LABELS
        ============================== */

        .contact-page .contact-form label {
            display: block;
            color: #e8e8df;
            font-family: 'Comfortaa', sans-serif;
            font-size: 12px;
            margin-bottom: 7px;
        }

        /* ==============================
           FORM INPUTS
        ============================== */

        .contact-page .contact-form .form-control {
            display: block;
            width: 100%;
            background-color: #526357;
            color: white;
            border: none;
            border-radius: 0;
            font-family: 'Lexend', sans-serif;
            font-size: 13px;
            margin-bottom: 14px;
            padding: 10px;
        }

        .contact-page .contact-form .form-control::placeholder {
            color: #c9cec8;
            opacity: 1;
        }

        .contact-page .contact-form .form-control:focus {
            background-color: #526357;
            color: white;
            box-shadow: 0 0 0 2px #a98263;
        }

        /* ==============================
           SUBMIT BUTTON
        ============================== */

        .contact-page .submit-btn {
            background-color: #a98263;
            color: white;
            border: none;
            border-radius: 0;
            width: 60%;
            padding: 10px;
            font-family: 'Lexend', sans-serif;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .contact-page .submit-btn:hover {
            background-color: #89694f;
            color: white;
        }

        /* ==============================
           IMAGE PLACEHOLDER
        ============================== */

        .contact-page .contact-image {
            display: block !important;
            visibility: visible !important;
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            background-color: #c9c9c9;
            border: 1px solid #99958d;
            overflow: hidden;
        }

        .contact-page .contact-image::before,
        .contact-page .contact-image::after {
            content: "";
            position: absolute;
            width: 141.5%;
            height: 1px;
            background-color: #99958d;
            top: 50%;
            left: -20.75%;
        }

        .contact-page .contact-image::before {
            transform: rotate(45deg);
        }

        .contact-page .contact-image::after {
            transform: rotate(-45deg);
        }

        /* ==============================
           SOCIAL MEDIA LINKS
        ============================== */

        .contact-page .social-links {
            display: flex !important;
            justify-content: space-around;
            align-items: center;
            text-align: center;
            margin-top: 15px;
        }

        .contact-page .social-links a {
            color: #293b30;
            text-decoration: none;
            font-family: 'Lexend', sans-serif;
            font-size: 12px;
            transition: 0.3s;
        }

        .contact-page .social-links i {
            display: block;
            font-size: 23px;
            margin-bottom: 3px;
        }

        .contact-page .social-links a:hover {
            color: #a98263;
        }

        /* ==============================
           FOOTER
        ============================== */

        .contact-page .site-footer {
            display: block !important;
            visibility: visible !important;
            position: relative;
            width: 100%;
            margin-top: auto !important;
            padding: 22px 0;
            background-color: #071b12;
            background-image: url('img/your-background-image.jpg');
            background-size: cover;
            background-position: center;
            color: #f5f1e8;
            flex-shrink: 0;
        }

        .contact-page .site-footer p {
            color: #f5f1e8;
            font-size: 13px;
        }

        .contact-page .site-footer a {
            color: #f5f1e8;
            text-decoration: none;
            font-family: 'Lexend', sans-serif;
            font-size: 13px;
        }

        .contact-page .site-footer a:hover {
            color: #a98263;
        }

        .contact-page .footer-icon {
            width: 20px;
            height: 20px;
            object-fit: contain;
        }

        /* ==============================
           TABLET AND MOBILE RESPONSIVENESS
        ============================== */

        @media (max-width: 767px) {

            .contact-page .site-header {
                padding: 8px 0 !important;
            }

            .contact-page .logo img {
                width: 55px;
                height: 55px;
            }

            .contact-page .logo-text {
                font-size: 18px;
            }

            .contact-page nav a {
                font-size: 11px;
            }

            .contact-page .nav-icon {
                width: 30px;
                height: 30px;
            }

            .contact-page .contact-heading {
                padding: 20px 15px;
            }

            .contact-page .contact-heading h1 {
                font-size: 25px;
            }

            .contact-page .contact-section {
                padding: 25px 18px;
            }

            .contact-page .contact-form {
                padding: 20px;
            }

            .contact-page .contact-image {
                aspect-ratio: 4 / 3;
            }

            .contact-page .submit-btn {
                width: 100%;
            }

            .contact-page .social-links {
                margin-bottom: 10px;
            }

            .contact-page .site-footer {
                padding: 15px 0;
            }
        }

    </style>

</head>

<body>

<div class="contact-page">

    <!-- ==============================
         HEADER / NAVIGATION
    ============================== -->

    <header class="site-header">

        <div class="container-fluid px-3 px-md-5 d-flex justify-content-between align-items-center">

            <!-- LOGO -->
            <div class="logo d-flex align-items-center">

                <img src="img/ThreadedLogo-SimpleLight.png"
                    alt="Threaded Logo Simple Light"
                    class="me-2">

                <span class="logo-text">
                    Threaded
                </span>

            </div>

            <!-- NAVIGATION -->
            <nav>

                <ul class="d-flex gap-3 gap-md-4 list-unstyled mb-0 text-center">

                    <li>
                        <a href="index.html"
                            class="d-flex flex-column align-items-center text-decoration-none">

                            <img src="img/home-icon-light.png"
                                alt="Home"
                                class="nav-icon">

                            Home

                        </a>
                    </li>

                    <li>
                        <a href="index.html#products-section"
                            class="d-flex flex-column align-items-center text-decoration-none">

                            <img src="img/shop-icon-light.png"
                                alt="Shop"
                                class="nav-icon">

                            Shop

                        </a>
                    </li>

                    <li>
                        <a href="contact.html"
                            class="d-flex flex-column align-items-center text-decoration-none">

                            <img src="img/Contact-icon-light.png"
                                alt="Contact"
                                class="nav-icon">

                            Contact

                        </a>
                    </li>

                </ul>

            </nav>

        </div>

    </header>


    <!-- ==============================
         CONTACT HEADING
    ============================== -->

    <section class="contact-heading">

        <h1>CONTACT US</h1>

        <p>Got a question?</p>

    </section>


    <!-- ==============================
         MAIN CONTACT SECTION
    ============================== -->

    <main class="contact-section">

        <div class="container-fluid">

            <div class="row g-4 align-items-start">

                <!-- LEFT: CONTACT FORM -->

                <div class="col-md-7">

                    <form class="contact-form" id="contactForm">

                        <div class="row">

                            <!-- FIRST NAME -->

                            <div class="col-md-6">

                                <label for="firstName">
                                    Name (Optional)
                                </label>

                                <input type="text"
                                    class="form-control"
                                    id="firstName"
                                    name="firstName"
                                    placeholder="First Name">

                            </div>

                            <!-- LAST NAME -->

                            <div class="col-md-6">

                                <label for="lastName">
                                    &nbsp;
                                </label>

                                <input type="text"
                                    class="form-control"
                                    id="lastName"
                                    name="lastName"
                                    placeholder="Last Name">

                            </div>

                            <!-- EMAIL -->

                            <div class="col-md-6">

                                <label for="email">
                                    Email Address
                                </label>

                                <input type="email"
                                    class="form-control"
                                    id="email"
                                    name="email"
                                    placeholder="Enter your email address"
                                    required>

                            </div>

                            <!-- MOBILE NUMBER -->

                            <div class="col-md-6">

                                <label for="mobile">
                                    Mobile Number
                                </label>

                                <input type="tel"
                                    class="form-control"
                                    id="mobile"
                                    name="mobile"
                                    placeholder="Enter your mobile number">

                            </div>

                            <!-- MESSAGE -->

                            <div class="col-12">

                                <label for="message">
                                    Message
                                </label>

                                <textarea class="form-control"
                                    id="message"
                                    name="message"
                                    rows="4"
                                    placeholder="Write your message here..."
                                    required></textarea>

                            </div>

                        </div>

                        <!-- SUBMIT BUTTON -->

                        <div class="text-center mt-2">

                            <button type="submit" class="btn submit-btn">
                                SUBMIT
                            </button>

                        </div>

                    </form>

                </div>


                <!-- RIGHT: IMAGE AND SOCIAL MEDIA -->

                <div class="col-md-5">

                    <!-- IMAGE PLACEHOLDER -->

                    <div class="contact-image"
                        role="img"
                        aria-label="Contact Us image placeholder">
                    </div>

                    <!-- SOCIAL MEDIA LINKS -->

                    <div class="social-links">

                        <!-- FACEBOOK -->

                        <a href="https://www.facebook.com/"
                            target="_blank"
                            rel="noopener noreferrer">

                            <i class="bi bi-facebook"></i>

                            Facebook

                        </a>

                        <!-- INSTAGRAM -->

                        <a href="https://www.instagram.com/"
                            target="_blank"
                            rel="noopener noreferrer">

                            <i class="bi bi-instagram"></i>

                            Instagram

                        </a>

                        <!-- TIKTOK -->

                        <a href="https://www.tiktok.com/"
                            target="_blank"
                            rel="noopener noreferrer">

                            <i class="bi bi-tiktok"></i>

                            TikTok

                        </a>

                    </div>

                </div>

            </div>

        </div>

    </main>


    <!-- ==============================
         FOOTER
    ============================== -->

    <footer class="site-footer text-center">

        <div class="container-fluid px-5">

            <p class="mb-1">
                ©2026 THREADED All Rights Reserved
            </p>

            <div class="d-flex justify-content-center gap-4 flex-wrap">

                <a href="privacy.html"
                    class="d-inline-flex align-items-center">

                    <img src="img/privacypolicy-icon-light.png"
                        alt="Privacy Policy Icon"
                        class="footer-icon me-1">

                    Privacy Policy

                </a>

                <a href="terms.html"
                    class="d-inline-flex align-items-center">

                    <img src="img/termsandcondition-icon-light.png"
                        alt="Terms and Condition Icon"
                        class="footer-icon me-1">

                    Terms and Condition

                </a>

            </div>

        </div>

    </footer>

</div>


<!-- ==============================
     JAVASCRIPT: CONTACT FORM
============================== -->

<script>

    const contactForm = document.getElementById("contactForm");

    contactForm.addEventListener("submit", function(event) {

        event.preventDefault();

        const firstName = document.getElementById("firstName").value.trim();
        const lastName = document.getElementById("lastName").value.trim();
        const email = document.getElementById("email").value.trim();
        const mobile = document.getElementById("mobile").value.trim();
        const message = document.getElementById("message").value.trim();

        // CHANGE THIS TO YOUR ACTUAL CONTACT EMAIL
        const recipient = "hello@examplewebsite142.com";

        const subject = encodeURIComponent(
            "Contact Us - Threaded Website"
        );

        const body = encodeURIComponent(

            "CONTACT US - THREADED\n\n" +

            "Name: " + firstName + " " + lastName + "\n" +

            "Email Address: " + email + "\n" +

            "Mobile Number: " + mobile + "\n\n" +

            "Message:\n" + message

        );

        const mailtoLink = "mailto:" + recipient +
            "?subject=" + subject +
            "&body=" + body;

        window.location.href = mailtoLink;

    });

</script>


<!-- BOOTSTRAP JAVASCRIPT -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
