<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Threaded - Contact Us</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;700&family=Lexend:wght@300;400;700&family=Tilt+Neon:XROT,YROT@-45..45,-45..45&display=swap"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Existing Threaded Stylesheet -->
    <link rel="stylesheet" href="css/wifivestyle.css">

    <!-- CONTACT PAGE STYLES -->
    <style>

        /* GENERAL CONTACT PAGE */
        body {
            margin: 0;
            font-family: 'Lexend', sans-serif;
        }

        /* CONTACT HEADING */
        .contact-heading {
            background-color: #293b30;
            color: #f5f1e8;
            text-align: center;
            padding: 25px 15px;
        }

        .contact-heading h1 {
            font-family: 'Lexend', sans-serif;
            font-weight: 700;
            font-size: 30px;
            margin-bottom: 5px;
        }

        .contact-heading p {
            font-family: 'Comfortaa', sans-serif;
            font-size: 14px;
            margin-bottom: 0;
            color: #d4d4ca;
        }

        /* MAIN CONTACT SECTION */
        .contact-section {
            padding: 35px 5%;
        }

        /* CONTACT FORM */
        .contact-form {
            background-color: #344b3d;
            padding: 25px;
            height: 100%;
        }

        .contact-form label {
            color: #e8e8df;
            font-family: 'Comfortaa', sans-serif;
            font-size: 12px;
            margin-bottom: 7px;
        }

        .contact-form .form-control {
            background-color: #526357;
            color: white;
            border: none;
            border-radius: 0;
            font-family: 'Lexend', sans-serif;
            font-size: 13px;
            margin-bottom: 14px;
            padding: 10px;
        }

        .contact-form .form-control::placeholder {
            color: #c9cec8;
            opacity: 1;
        }

        .contact-form .form-control:focus {
            background-color: #526357;
            color: white;
            box-shadow: 0 0 0 2px #a98263;
        }

        /* SUBMIT BUTTON */
        .submit-btn {
            background-color: #a98263;
            color: white;
            border: none;
            border-radius: 0;
            width: 60%;
            padding: 10px;
            font-family: 'Lexend', sans-serif;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .submit-btn:hover {
            background-color: #89694f;
            color: white;
        }

        /* CONTACT IMAGE PLACEHOLDER */
        .contact-image {
            width: 100%;
            aspect-ratio: 1 / 1;
            background-color: #d2cec4;
            border: 1px solid #99958d;
            position: relative;
            overflow: hidden;
        }

        .contact-image::before,
        .contact-image::after {
            content: "";
            position: absolute;
            width: 141.5%;
            height: 1px;
            background-color: #99958d;
            top: 50%;
            left: -20.75%;
        }

        .contact-image::before {
            transform: rotate(45deg);
        }

        .contact-image::after {
            transform: rotate(-45deg);
        }

        /* SOCIAL MEDIA LINKS */
        .social-links {
            display: flex;
            justify-content: space-around;
            align-items: center;
            text-align: center;
            margin-top: 15px;
        }

        .social-links a {
            color: #293b30;
            text-decoration: none;
            font-family: 'Lexend', sans-serif;
            font-size: 12px;
            transition: 0.3s;
        }

        .social-links i {
            display: block;
            font-size: 23px;
            margin-bottom: 3px;
        }

        .social-links a:hover {
            color: #a98263;
        }

        /* FOOTER */
        .site-footer {
            margin-top: 0 !important;
        }

        /* MOBILE RESPONSIVENESS */
        @media (max-width: 767px) {

            .contact-heading h1 {
                font-size: 25px;
            }

            .contact-section {
                padding: 25px 18px;
            }

            .contact-form {
                padding: 20px;
            }

            .contact-image {
                aspect-ratio: 4 / 3;
            }

            .submit-btn {
                width: 100%;
            }

            .social-links {
                margin-bottom: 10px;
            }

        }

    </style>
</head>


<body>

    <!-- HEADER / NAVIGATION -->
    <header class="site-header py-3">

        <div class="container-fluid px-3 px-md-5 d-flex justify-content-between align-items-center">

            <!-- LOGO -->
            <div class="logo d-flex align-items-center">

                <img src="img/ThreadedLogo-SimpleLight.png"
                    alt="Threaded Logo Simple Light"
                    class="me-2"
                    style="width: 83px; height: 83px; object-fit: contain;">

                <span class="logo-text"
                    style="font-family: 'Tilt Neon', sans-serif; font-variation-settings: 'XROT' 13, 'YROT' 45;">
                    Threaded
                </span>

            </div>


            <!-- NAVIGATION LINKS -->
            <nav>

                <ul class="d-flex gap-3 gap-md-4 list-unstyled mb-0 text-center">

                    <li>
                        <a href="index.html"
                            class="d-flex flex-column align-items-center text-decoration-none">

                            <img src="img/home-icon-light.png"
                                alt="Navigate to Home"
                                class="nav-icon">

                            Home

                        </a>
                    </li>


                    <li>
                        <a href="index.html#products-section"
                            class="d-flex flex-column align-items-center text-decoration-none">

                            <img src="img/shop-icon-light.png"
                                alt="Navigate to Shop"
                                class="nav-icon">

                            Shop

                        </a>
                    </li>


                    <li>
                        <a href="contact.html"
                            class="d-flex flex-column align-items-center text-decoration-none">

                            <img src="img/Contact-icon-light.png"
                                alt="Navigate to Contact Us"
                                class="nav-icon">

                            Contact

                        </a>
                    </li>

                </ul>

            </nav>

        </div>

    </header>



    <!-- CONTACT US HEADING -->
    <section class="contact-heading">

        <h1>CONTACT US</h1>

        <p>Got a question?</p>

    </section>



    <!-- MAIN CONTACT SECTION -->
    <section class="contact-section">

        <div class="container-fluid">

            <div class="row g-4 align-items-start">


                <!-- LEFT SIDE: CONTACT FORM -->
                <div class="col-md-7">

                    <form class="contact-form" id="contactForm">

                        <div class="row">

                            <!-- FIRST NAME -->
                            <div class="col-md-6">

                                <label for="firstName">
                                    Name (Optional)
                                </label>

                                <input type="text"
                                    class="form-control"
                                    id="firstName"
                                    name="firstName"
                                    placeholder="First Name">

                            </div>


                            <!-- LAST NAME -->
                            <div class="col-md-6">

                                <label for="lastName">
                                    &nbsp;
                                </label>

                                <input type="text"
                                    class="form-control"
                                    id="lastName"
                                    name="lastName"
                                    placeholder="Last Name">

                            </div>


                            <!-- EMAIL ADDRESS -->
                            <div class="col-md-6">

                                <label for="email">
                                    Email Address
                                </label>

                                <input type="email"
                                    class="form-control"
                                    id="email"
                                    name="email"
                                    placeholder="Enter your email address"
                                    required>

                            </div>


                            <!-- MOBILE NUMBER -->
                            <div class="col-md-6">

                                <label for="mobile">
                                    Mobile Number
                                </label>

                                <input type="tel"
                                    class="form-control"
                                    id="mobile"
                                    name="mobile"
                                    placeholder="Enter your mobile number">

                            </div>


                            <!-- MESSAGE -->
                            <div class="col-12">

                                <label for="message">
                                    Message
                                </label>

                                <textarea class="form-control"
                                    id="message"
                                    name="message"
                                    rows="4"
                                    placeholder="Write your message here..."
                                    required></textarea>

                            </div>

                        </div>


                        <!-- SUBMIT BUTTON -->
                        <div class="text-center mt-2">

                            <button type="submit" class="btn submit-btn">
                                SUBMIT
                            </button>

                        </div>

                    </form>

                </div>



                <!-- RIGHT SIDE: IMAGE AND SOCIAL MEDIA -->
                <div class="col-md-5">


                    <!-- IMAGE PLACEHOLDER -->
                    <div class="contact-image"
                        role="img"
                        aria-label="Contact Us image placeholder">
                    </div>



                    <!-- SOCIAL MEDIA LINKS -->
                    <div class="social-links">


                        <!-- FACEBOOK -->
                        <a href="https://www.facebook.com/"
                            target="_blank"
                            rel="noopener noreferrer">

                            <i class="bi bi-facebook"></i>

                            Facebook

                        </a>


                        <!-- INSTAGRAM -->
                        <a href="https://www.instagram.com/"
                            target="_blank"
                            rel="noopener noreferrer">

                            <i class="bi bi-instagram"></i>

                            Instagram

                        </a>


                        <!-- TIKTOK -->
                        <a href="https://www.tiktok.com/"
                            target="_blank"
                            rel="noopener noreferrer">

                            <i class="bi bi-tiktok"></i>

                            TikTok

                        </a>

                    </div>

                </div>

            </div>

        </div>

    </section>



    <!-- FOOTER -->
    <footer class="site-footer text-center">

        <div class="container-fluid px-5">

            <p class="mb-1">
                ©2026 THREADED All Rights Reserved
            </p>


            <div class="d-flex justify-content-center gap-4 flex-wrap">

                <a href="privacy.html"
                    class="d-inline-flex align-items-center">

                    <img src="img/privacypolicy-icon-light.png"
                        alt="Privacy Policy Icon"
                        class="footer-icon me-1">

                    Privacy Policy

                </a>


                <a href="terms.html"
                    class="d-inline-flex align-items-center">

                    <img src="img/termsandcondition-icon-light.png"
                        alt="Terms and Condition Icon"
                        class="footer-icon me-1">

                    Terms and Condition

                </a>

            </div>

        </div>

    </footer>



    <!-- JAVASCRIPT: METHOD #2 (MAILTO) -->
    <script>

        // Get the contact form
        const contactForm = document.getElementById("contactForm");


        // Listen for form submission
        contactForm.addEventListener("submit", function(event) {

            // Prevent normal form submission
            event.preventDefault();


            // Get visitor information
            const firstName = document.getElementById("firstName").value.trim();

            const lastName = document.getElementById("lastName").value.trim();

            const email = document.getElementById("email").value.trim();

            const mobile = document.getElementById("mobile").value.trim();

            const message = document.getElementById("message").value.trim();


            // Recipient email address
            const recipient = "hello@examplewebsite142.com";


            // Email subject
            const subject = encodeURIComponent("Contact Us - Threaded Website");


            // Email message body
            const body = encodeURIComponent(

                "CONTACT US - THREADED\n\n" +

                "Name: " + firstName + " " + lastName + "\n" +

                "Email Address: " + email + "\n" +

                "Mobile Number: " + mobile + "\n\n" +

                "Message:\n" + message

            );


            // Open the visitor's default email application
            const mailtoLink = "mailto:" + recipient +
                "?subject=" + subject +
                "&body=" + body;


            window.location.href = mailtoLink;

        });

    </script>



    <!-- BOOTSTRAP JAVASCRIPT -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


</body>

</html>
