
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Threaded - Contact Us</title>

    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- GOOGLE FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;700&family=Lexend:wght@300;400;700&family=Tilt+Neon:XROT,YROT@-45..45,-45..45&display=swap"
        rel="stylesheet">

    <!-- BOOTSTRAP ICONS -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        /* =================================
           SHARED THREADED WEBSITE STYLES
           MATCHED WITH TERMS AND CONDITIONS
        ================================= */

        :root {
            --primary-green: #2C3930;
            --secondary-green: #3F4F44;
            --brand-tan: #A27B5C;
            --bg-beige: #DCD7C9;

            --font-heading: 'Lexend', sans-serif;
            --font-body: 'Comfortaa', sans-serif;
            --font-logo: 'Tilt Neon', sans-serif;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            min-height: 100%;
        }

        body {
            background-color: var(--bg-beige);
            font-family: var(--font-body);
            color: var(--primary-green);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        main {
            flex-grow: 1;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: var(--font-heading);
            color: var(--primary-green);
        }

        a {
            color: var(--primary-green);
        }

        .logo-text {
            font-family: var(--font-logo);
            font-weight: 400;
            font-variation-settings: 'XROT' 13, 'YROT' 45;
            color: #DCD7C9;
            font-size: 32px;
        }

        /* HEADER - SAME AS TERMS PAGE */

        .site-header {
            background-color: rgba(44, 57, 48, 0.85);
            background-image: url('img/headerfooter-bg.jpg');
            background-repeat: repeat;
            background-position: center center;
            color: #DCD7C9;
            width: 100%;
            height: 100px;
            display: flex;
            align-items: center;
            padding: 15px 0;
            flex-shrink: 0;
        }

        /* FOOTER - SAME AS TERMS PAGE */

        .site-footer {
            background-image: url('img/headerfooter-bg.jpg');
            background-size: cover;
            background-position: center;
            margin-top: auto;
            height: auto;
            min-height: 70px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 1.5rem 0;
            font-size: 15px;
        }

        .site-footer p {
            color: #DCD7C9;
        }

        /* ICONS */

        .nav-icon {
            width: 50px;
            height: 50px;
            margin-bottom: 5px;
            object-fit: contain;
        }

        .footer-icon {
            width: 25px;
            height: 25px;
            object-fit: contain;
        }

        .site-header a {
            color: #DCD7C9;
            text-decoration: none;
            font-size: 20px;
        }

        .site-footer a {
            color: #DCD7C9;
            text-decoration: none;
        }

        .site-header a:hover,
        .site-footer a:hover {
            color: var(--brand-tan);
        }

        /* ACCESSIBILITY */

        a:focus-visible,
        button:focus-visible,
        input:focus-visible,
        textarea:focus-visible {
            outline: 3px solid var(--brand-tan);
            outline-offset: 2px;
        }


        /* =================================
           CONTACT PAGE
        ================================= */

        /* BEIGE CONTACT US TITLE STRIP */

        .contact-title {
            width: 100%;
            background-color: var(--bg-beige);
            text-align: center;
            padding: 13px 15px;
        }

        .contact-title h1 {
            font-family: var(--font-heading);
            font-size: 26px;
            font-weight: 700;
            color: var(--primary-green);
            margin: 0;
        }


        /* GREEN SUBTITLE STRIP */

        .contact-subtitle {
            width: 100%;
            background-color: var(--primary-green);
            text-align: center;
            padding: 16px 15px;
        }

        .contact-subtitle p {
            font-family: var(--font-body);
            font-size: 14px;
            color: var(--bg-beige);
            margin: 0;
        }


        /* MAIN CONTACT SECTION */

        .contact-section {
            width: 100%;
            flex-grow: 1;
            padding: 35px 5%;
            background-color: var(--bg-beige);
        }


        /* CONTACT FORM */

        .contact-form {
            background-color: var(--primary-green);
            padding: 25px;
            height: 100%;
            width: 100%;
        }

        .contact-form label {
            display: block;
            color: #E8E8DF;
            font-family: var(--font-body);
            font-size: 12px;
            margin-bottom: 7px;
        }


        /* INPUT FIELDS */

        .contact-form .form-control {
            background-color: #526357;
            color: white;
            border: none;
            border-radius: 0;
            font-family: var(--font-heading);
            font-size: 13px;
            margin-bottom: 14px;
            padding: 10px;
        }

        .contact-form .form-control::placeholder {
            color: #DCD7C9;
            opacity: 1;
        }

        .contact-form .form-control:focus {
            background-color: #526357;
            color: white;
            box-shadow: 0 0 0 2px var(--brand-tan);
        }


        /* SUBMIT BUTTON */

        .submit-btn {
            background-color: var(--brand-tan);
            color: white;
            border: none;
            border-radius: 0;
            width: 60%;
            padding: 10px;
            font-family: var(--font-heading);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .submit-btn:hover {
            background-color: #89694F;
            color: white;
        }


        /* CONTACT IMAGE PLACEHOLDER */

        .contact-image {
            display: block;
            position: relative;
            width: 100%;
            height: 390px;
            background-color: #C9C9C9;
            border: 1px solid #99958D;
            overflow: hidden;
        }

        .contact-image::before,
        .contact-image::after {
            content: "";
            position: absolute;
            width: 141.5%;
            height: 1px;
            background-color: #99958D;
            top: 50%;
            left: -20.75%;
        }

        .contact-image::before {
            transform: rotate(45deg);
        }

        .contact-image::after {
            transform: rotate(-45deg);
        }


        /* SOCIAL MEDIA LINKS */

        .social-links {
            display: flex;
            justify-content: space-around;
            align-items: center;
            text-align: center;
            margin-top: 15px;
        }

        .social-links a {
            color: var(--primary-green);
            text-decoration: none;
            font-family: var(--font-heading);
            font-size: 12px;
            transition: 0.3s;
        }

        .social-links i {
            display: block;
            font-size: 23px;
            margin-bottom: 3px;
        }

        .social-links a:hover {
            color: var(--brand-tan);
        }


        /* =================================
           RESPONSIVE DESIGN
           HEADER MATCHES TERMS PAGE
        ================================= */

        @media (max-width: 768px) {

            .site-header {
                height: 80px;
                padding: 0;
            }

            .site-header .container-fluid {
                flex-direction: row;
                flex-wrap: nowrap;
                padding: 0 10px;
            }

            .site-header .logo img {
                width: 45px !important;
                height: 45px !important;
            }

            .site-header .logo-text {
                font-size: 1.2rem;
            }

            .site-header nav ul {
                gap: 10px;
            }

            .nav-icon {
                width: 25px;
                height: 25px;
            }

            .site-header a {
                font-size: 0.7rem;
            }

            /* CONTACT PAGE MOBILE */

            .contact-title {
                padding: 12px 15px;
            }

            .contact-title h1 {
                font-size: 23px;
            }

            .contact-subtitle {
                padding: 14px;
            }

            .contact-section {
                padding: 25px 18px;
            }

            .contact-form {
                padding: 20px;
            }

            .contact-image {
                height: 280px;
            }

            .submit-btn {
                width: 100%;
            }

            .social-links {
                margin-bottom: 10px;
            }

            .site-footer {
                padding: 1.5rem 0;
            }
        }


        @media (max-width: 480px) {

            .contact-title h1 {
                font-size: 21px;
            }

            .contact-section {
                padding: 20px 15px;
            }

            .contact-image {
                height: 240px;
            }

            .contact-form {
                padding: 18px;
            }

        }

    </style>

</head>


<body>

    <!-- =================================
         HEADER - SAME AS TERMS PAGE
    ================================= -->

    <header class="site-header py-3">

        <div class="container-fluid px-3 px-md-5 d-flex justify-content-between align-items-center">

            <!-- LOGO -->

            <div class="logo d-flex align-items-center">

                <img src="img/ThreadedLogo-SimpleLight.png"
                    alt="Threaded Logo Simple Light"
                    class="me-2"
                    style="width: 83px; height: 83px; object-fit: contain;">

                <span class="logo-text"
                    style="font-family: 'Tilt Neon', sans-serif; font-variation-settings: 'XROT' 13, 'YROT' 45;">

                    Threaded

                </span>

            </div>


            <!-- NAVIGATION -->

            <nav>

                <ul class="d-flex gap-4 list-unstyled mb-0 text-center">

                    <li>

                        <a href="index.html"
                            class="d-flex flex-column align-items-center text-decoration-none">

                            <img src="img/home-icon-light.png"
                                alt="Navigate to Home"
                                class="nav-icon">

                            Home

                        </a>

                    </li>


                    <li>

                        <a href="index.html#products-section"
                            class="d-flex flex-column align-items-center text-decoration-none">

                            <img src="img/shop-icon-light.png"
                                alt="Navigate to Shop"
                                class="nav-icon">

                            Shop

                        </a>

                    </li>


                    <li>

                        <a href="contact.html"
                            class="d-flex flex-column align-items-center text-decoration-none">

                            <img src="img/Contact-icon-light.png"
                                alt="Navigate to Contact Us"
                                class="nav-icon">

                            Contact

                        </a>

                    </li>

                </ul>

            </nav>

        </div>

    </header>


    <!-- =================================
         CONTACT US TITLE - BEIGE STRIP
    ================================= -->

    <section class="contact-title">

        <h1>CONTACT US</h1>

    </section>


    <!-- =================================
         CONTACT SUBTITLE - GREEN STRIP
    ================================= -->

    <section class="contact-subtitle">

        <p>Got a question?</p>

    </section>


    <!-- =================================
         MAIN CONTACT SECTION
    ================================= -->

    <main class="contact-section">

        <div class="container-fluid">

            <div class="row g-4 align-items-start">


                <!-- LEFT SIDE: CONTACT FORM -->

                <div class="col-md-7">

                    <form class="contact-form" id="contactForm">

                        <div class="row">


                            <!-- FIRST NAME -->

                            <div class="col-md-6">

                                <label for="firstName">
                                    Name (Optional)
                                </label>

                                <input type="text"
                                    class="form-control"
                                    id="firstName"
                                    name="firstName"
                                    placeholder="First Name">

                            </div>


                            <!-- LAST NAME -->

                            <div class="col-md-6">

                                <label for="lastName">
                                    &nbsp;
                                </label>

                                <input type="text"
                                    class="form-control"
                                    id="lastName"
                                    name="lastName"
                                    placeholder="Last Name">

                            </div>


                            <!-- EMAIL ADDRESS -->

                            <div class="col-md-6">

                                <label for="email">
                                    Email Address
                                </label>

                                <input type="email"
                                    class="form-control"
                                    id="email"
                                    name="email"
                                    placeholder="Enter your email address"
                                    required>

                            </div>


                            <!-- MOBILE NUMBER -->

                            <div class="col-md-6">

                                <label for="mobile">
                                    Mobile Number
                                </label>

                                <input type="tel"
                                    class="form-control"
                                    id="mobile"
                                    name="mobile"
                                    placeholder="Enter your mobile number">

                            </div>


                            <!-- MESSAGE -->

                            <div class="col-12">

                                <label for="message">
                                    Message
                                </label>

                                <textarea class="form-control"
                                    id="message"
                                    name="message"
                                    rows="4"
                                    placeholder="Write your message here..."
                                    required></textarea>

                            </div>

                        </div>


                        <!-- SUBMIT BUTTON -->

                        <div class="text-center mt-2">

                            <button type="submit" class="btn submit-btn">

                                SUBMIT

                            </button>

                        </div>

                    </form>

                </div>



                <!-- RIGHT SIDE: IMAGE AND SOCIAL MEDIA -->

                <div class="col-md-5">


                    <!-- IMAGE PLACEHOLDER -->

                    <div class="contact-image"
                        role="img"
                        aria-label="Contact Us image placeholder">

                    </div>



                    <!-- SOCIAL MEDIA LINKS -->

                    <div class="social-links">


                        <!-- FACEBOOK -->

                        <a href="https://www.facebook.com/"
                            target="_blank"
                            rel="noopener noreferrer">

                            <i class="bi bi-facebook"></i>

                            Facebook

                        </a>


                        <!-- INSTAGRAM -->

                        <a href="https://www.instagram.com/"
                            target="_blank"
                            rel="noopener noreferrer">

                            <i class="bi bi-instagram"></i>

                            Instagram

                        </a>


                        <!-- TIKTOK -->

                        <a href="https://www.tiktok.com/"
                            target="_blank"
                            rel="noopener noreferrer">

                            <i class="bi bi-tiktok"></i>

                            TikTok

                        </a>

                    </div>

                </div>

            </div>

        </div>

    </main>



    <!-- =================================
         FOOTER - SAME AS TERMS PAGE
    ================================= -->

    <footer class="site-footer text-center">

        <div class="container-fluid px-5">

            <p class="mb-1">
                ©2026 THREADED All Rights Reserved
            </p>


            <div class="d-flex justify-content-center gap-4 flex-wrap">


                <!-- PRIVACY POLICY -->

                <a href="privacy.html"
                    class="d-inline-flex align-items-center">

                    <img src="img/privacypolicy-icon-light.png"
                        alt="Privacy Policy Icon"
                        class="footer-icon me-1">

                    Privacy Policy

                </a>


                <!-- TERMS AND CONDITIONS -->

                <a href="terms.html"
                    class="d-inline-flex align-items-center">

                    <img src="img/termsandcondition-icon-light.png"
                        alt="Terms and Condition Icon"
                        class="footer-icon me-1">

                    Terms and Condition

                </a>

            </div>

        </div>

    </footer>



    <!-- =================================
         JAVASCRIPT: CONTACT FORM
    ================================= -->

    <script>

        const contactForm = document.getElementById("contactForm");

        contactForm.addEventListener("submit", function(event) {

            event.preventDefault();

            const firstName = document.getElementById("firstName").value.trim();

            const lastName = document.getElementById("lastName").value.trim();

            const email = document.getElementById("email").value.trim();

            const mobile = document.getElementById("mobile").value.trim();

            const message = document.getElementById("message").value.trim();


            // CHANGE TO YOUR ACTUAL CONTACT EMAIL

            const recipient = "hello@examplewebsite142.com";


            const subject = encodeURIComponent(
                "Contact Us - Threaded Website"
            );


            const body = encodeURIComponent(

                "CONTACT US - THREADED\n\n" +

                "Name: " + firstName + " " + lastName + "\n" +

                "Email Address: " + email + "\n" +

                "Mobile Number: " + mobile + "\n\n" +

                "Message:\n" + message

            );


            const mailtoLink = "mailto:" + recipient +
                "?subject=" + subject +
                "&body=" + body;


            window.location.href = mailtoLink;

        });

    </script>


    <!-- BOOTSTRAP JAVASCRIPT -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
